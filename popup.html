<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Color Picker</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <header class="header">
      <h1>
        <img class="header-icon" src="icons/icon48.png" alt="Color Picker">
        <span data-i18n="extName">Color Picker</span>
      </h1>
      <button id="themeToggle" class="theme-toggle" title="Toggle theme">
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
        </svg>
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="5"/>
          <line x1="12" y1="1" x2="12" y2="3"/>
          <line x1="12" y1="21" x2="12" y2="23"/>
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/>
          <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
          <line x1="1" y1="12" x2="3" y2="12"/>
          <line x1="21" y1="12" x2="23" y2="12"/>
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>
          <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
        </svg>
      </button>
    </header>
    
    <button id="pickColor" class="pick-btn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="m2 22 1-1h3l9-9"/>
        <path d="M3 21v-3l9-9"/>
        <path d="m15 6 3.4-3.4a2.1 2.1 0 1 1 3 3L18 9l.4.4a2.1 2.1 0 1 1-3 3l-3.8-3.8a2.1 2.1 0 1 1 3-3l.4.4Z"/>
      </svg>
      <span data-i18n="pickColor">Pick Color</span>
    </button>
    <div class="shortcut-hint" id="shortcutDisplay">Alt+C</div>
    
    <div class="color-preview" id="colorPreview">
      <div class="preview-box" id="previewBox"></div>
      <div class="color-info">
        <div class="color-value" id="colorValue" data-i18n="noColorSelected">No color selected</div>
        <div class="color-name" id="colorName"></div>
        <div class="color-contrast" id="colorContrast"></div>
      </div>
    </div>
    
    <div class="format-section">
      <label data-i18n="colorFormat">Color Format</label>
      <div class="format-options">
        <button class="format-btn active" data-format="hex">HEX</button>
        <button class="format-btn" data-format="rgb">RGB</button>
        <button class="format-btn" data-format="rgba">RGBA</button>
        <button class="format-btn" data-format="hsl">HSL</button>
      </div>
    </div>
    
    <div class="history-section">
      <label data-i18n="recentColors">Recent Colors</label>
      <div class="color-history" id="colorHistory"></div>
    </div>
    
    <div class="page-colors-section">
      <div class="section-header">
        <label data-i18n="colorsOnPage">Colors on This Page</label>
        <div class="section-actions">
          <button id="copyAllColors" class="icon-btn" title="Copy all colors" style="display: none;">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="9" y="9" width="13" height="13" rx="2" ry="2"/>
              <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
            </svg>
          </button>
          <button id="scanColors" class="icon-btn" title="Scan page for colors">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"/>
              <path d="M21 3v5h-5"/>
            </svg>
          </button>
        </div>
      </div>
      <div class="page-colors" id="pageColors">
        <span class="page-colors-empty" data-i18n="clickToScan">Click refresh to scan</span>
      </div>
    </div>
    
    <div class="status" id="status"></div>
  </div>
  
  <script src="popup.js"></script>
</body>
</html>
